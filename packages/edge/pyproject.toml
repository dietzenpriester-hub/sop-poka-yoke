[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sop-edge"
version = "1.0.0"
description = "SOP 防呆系统 — 边缘计算层"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
    "numpy",
    "Pillow",
    "redis>=5.0",
    "paho-mqtt>=2.0",
    "pyserial>=3.5",
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "loguru>=0.7",
    "minio>=7.2",
    "requests",
    "pyyaml>=6.0",
    "pymodbus>=3.6",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
