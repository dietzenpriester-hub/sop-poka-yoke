# === 开发环境配置 ===
# 生产环境必须：启用密码认证、关闭匿名、添加 TLS
# 参考: https://mosquitto.org/man/mosquitto-conf-5.html

listener 1883
# 开发环境允许匿名连接；生产环境请改为 false 并配置 password_file
allow_anonymous true
# password_file /mosquitto/config/passwd
#
# --- 生产环境认证示例（全部保持注释，按需取消注释并挂载 passwd / acl 文件）---
# allow_anonymous false
# password_file /mosquitto/config/passwd
# # 生成密码文件（在宿主机执行一次后挂载进容器）:
# # mosquitto_passwd -c /path/to/passwd sop_mqtt_user
# acl_file /mosquitto/config/acl
# # 示例 acl（每行一条规则）:
# # user sop_mqtt_user
# # topic readwrite sop/#
# 生产环境取消以下注释并配置 TLS:
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

listener 9883
protocol websockets

