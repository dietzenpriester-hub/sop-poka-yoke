# =============================================================================
# SOP 防呆系统 — 宿主机 Nginx 反向代理配置
# =============================================================================
#
# 安装方式：
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/sop
#   sudo ln -s /etc/nginx/sites-available/sop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：此文件是宿主机上的 Nginx 配置，不是 Docker 内的 nginx.conf。
# Docker 内的 nginx.conf 负责前端静态文件和 API 代理；
# 本文件负责将外部请求转发到 Docker Web 容器（127.0.0.1:8080）。

# ---------- HTTP（内网环境直接使用） ----------
server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体大小限制（视频上传需要较大限制）
    client_max_body_size 500M;

    # 普通 HTTP 请求 → Docker Web 容器
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10;
        proxy_read_timeout 120;
    }

    # WebSocket → Docker Web 容器（内部再转发到 Server）
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

