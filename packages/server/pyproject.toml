[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sop-server"
version = "1.0.0"
description = "SOP 防呆系统 — 服务端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "paho-mqtt>=2.0",
    "minio>=7.2",
    "python-multipart",
    "loguru>=0.7",
    "httpx",
    "pyjwt>=2.0",
    # AI 分析
    "opencv-python-headless>=4.9",
    "ultralytics>=8.2",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
prod = ["gunicorn"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]
