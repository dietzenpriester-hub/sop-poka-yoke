# 边缘端默认配置
camera:
  urls:
    - "rtsp://CHANGEME:CHANGEME@192.168.1.64:554/Streaming/Channels/101"
  width: 2560
  height: 1440
  fps: 25
  use_gstreamer: false

yolo:
  model_path: "yolo11n.pt"
  conf_threshold: 0.4
  device: "cuda:0"

vlm:
  ollama_url: "http://localhost:11434"
  model: "qwen3-vl:8b-instruct"
  timeout: 10.0
  num_ctx: 2048

# 运行时通过同名环境变量 SOP_* 生效，用于减少空闲画面和单帧噪声触发 VLM。
vlm_gate:
  enabled: true
  operation_roi: "0.1,0.1,0.9,0.9"
  stable_frames: 2
  cooldown_seconds: 1.0
  min_detection_confidence: 0.25
  target_objects: []

engine:
  step_timeout_seconds: 60.0
  debounce_seconds: 0.5

hardware:
  modbus_host: "192.168.1.100"
  modbus_port: 502

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "CHANGEME"
  bucket: "sop-videos"

redis:
  url: "redis://localhost:6379/0"

mqtt:
  broker: "localhost"
  port: 1883

recorder:
  buffer_seconds: 10
  clip_output_dir: "./clips"

logging:
  dir: "./logs"
  level: "INFO"
