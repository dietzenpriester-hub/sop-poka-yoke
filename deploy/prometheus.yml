global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "sop-server"
    # 需要在 FastAPI 中集成 prometheus-fastapi-instrumentator 暴露 /metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8000"]

  # 边缘端指标（需部署 node_exporter 或自定义 Prometheus exporter）
  # - job_name: "sop-edge"
  #   static_configs:
  #     - targets: ["host.docker.internal:9100"]