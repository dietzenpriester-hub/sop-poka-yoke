name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server-test:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sop_test
          POSTGRES_USER: sop_admin
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U sop_admin -d sop_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/server/pyproject.toml

      - name: 安装依赖
        working-directory: packages/server
        run: pip install -e ".[dev]"

      - name: Ruff 代码检查
        working-directory: packages/server
        run: ruff check src/

      - name: 运行单元测试
        working-directory: packages/server
        env:
          SOP_DATABASE_URL: postgresql+asyncpg://sop_admin:testpass@localhost:5432/sop_test
          SOP_JWT_SECRET: ci-test-secret-key-for-testing
          SOP_REDIS_URL: redis://localhost:6379/0
          SOP_MQTT_BROKER_HOST: localhost
        run: pytest tests/ -v --tb=short

  edge-test:
    name: 边缘端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/edge/pyproject.toml

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: 安装依赖
        working-directory: packages/edge
        run: pip install -e ".[dev]"

      - name: Ruff 代码检查
        working-directory: packages/edge
        run: ruff check src/

      - name: 运行单元测试
        working-directory: packages/edge
        run: pytest tests/ -v --tb=short || true

  web-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装依赖
        working-directory: packages/web
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查
        working-directory: packages/web
        run: pnpm exec vue-tsc --noEmit

      - name: 生产构建
        working-directory: packages/web
        run: pnpm build

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [server-test, web-build]
    steps:
      - uses: actions/checkout@v4

      - name: 构建 Server 镜像
        run: docker build -t sop-server:ci ./packages/server

      - name: 构建 Web 镜像
        run: docker build -t sop-web:ci ./packages/web

      - name: 验证镜像
        run: |
          docker images sop-server:ci
          docker images sop-web:ci
