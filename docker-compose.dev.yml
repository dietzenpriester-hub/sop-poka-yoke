services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sop_pokayoke
      POSTGRES_USER: sop_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-changeme}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${SOP_MINIO_SECRET_KEY:-${MINIO_PASSWORD:-changeme}}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9883:9883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf
